<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Archive document ingestion and replacement pipeline</title>
  <desc id="desc">A numbered left-to-right durable ingestion pipeline covers quota reservation, private upload, metadata confirmation, extraction, chunking, indexing, embedding, atomic activation, visible states, failure cleanup, and replacement safety.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#fff;stroke:#334155;stroke-width:2}.laneHead{fill:#172554}.laneTitle{fill:#fff;font:700 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.step{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.work{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.store{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.danger{fill:#fff1f2;stroke:#be123c;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.num{fill:#1d4ed8;font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#0f172a;font:600 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#334155;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.state{fill:#fff;stroke:#64748b;stroke-width:1.5}.stateText{fill:#0f172a;font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace}.flow{fill:none;stroke:#0f172a;stroke-width:3;marker-end:url(#arrow)}.retry{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#retryArrow)}.fail{fill:none;stroke:#be123c;stroke-width:2.5;marker-end:url(#failArrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f172a"/></marker>
    <marker id="retryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="failArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be123c"/></marker>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <rect class="lane" x="30" y="35" width="1540" height="520" rx="18"/>
  <path class="laneHead" d="M48 35h1504a18 18 0 0 1 18 18v42H30V53a18 18 0 0 1 18-18Z"/>
  <text class="laneTitle" x="55" y="75">New document version: durable Workflow</text>

  <g aria-label="Step 1 terms and quota check">
    <rect class="step" x="55" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="75" y="170">1</text><text class="label" x="145" y="190" text-anchor="middle">Terms + quota</text>
    <text class="small" x="145" y="220" text-anchor="middle">Atomic reservation</text><text class="small" x="145" y="243" text-anchor="middle">count + bytes</text>
  </g>
  <g aria-label="Step 2 private upload">
    <rect class="store" x="270" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="290" y="170">2</text><text class="label" x="360" y="190" text-anchor="middle">Private R2 upload</text>
    <text class="small" x="360" y="220" text-anchor="middle">Validate size, MIME,</text><text class="small" x="360" y="243" text-anchor="middle">extension, content</text>
  </g>
  <g aria-label="Step 3 metadata confirmation">
    <rect class="step" x="485" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="505" y="170">3</text><text class="label" x="575" y="190" text-anchor="middle">Suggest metadata</text>
    <text class="small" x="575" y="220" text-anchor="middle">User confirms title,</text><text class="small" x="575" y="243" text-anchor="middle">system, edition</text>
  </g>
  <g aria-label="Step 4 durable workflow">
    <rect class="work" x="700" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="720" y="170">4</text><text class="label" x="790" y="190" text-anchor="middle">Start Workflow</text>
    <text class="small" x="790" y="220" text-anchor="middle">Idempotent by</text><text class="small" x="790" y="243" text-anchor="middle">job_id + version_id</text>
  </g>
  <g aria-label="Step 5 extraction">
    <rect class="work" x="915" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="935" y="170">5</text><text class="label" x="1005" y="190" text-anchor="middle">Extract + normalize</text>
    <text class="small" x="1005" y="220" text-anchor="middle">Page / line aware</text><text class="small" x="1005" y="243" text-anchor="middle">stable text</text>
  </g>
  <g aria-label="Step 6 chunking">
    <rect class="work" x="1130" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="1150" y="170">6</text><text class="label" x="1220" y="190" text-anchor="middle">Chunk + locate</text>
    <text class="small" x="1220" y="220" text-anchor="middle">Structural boundaries</text><text class="small" x="1220" y="243" text-anchor="middle">source offsets</text>
  </g>
  <g aria-label="Step 7 exact index">
    <rect class="store" x="1345" y="140" width="180" height="120" rx="14"/>
    <text class="num" x="1365" y="170">7</text><text class="label" x="1435" y="190" text-anchor="middle">Write D1 / FTS5</text>
    <text class="small" x="1435" y="220" text-anchor="middle">Chunks + exact</text><text class="small" x="1435" y="243" text-anchor="middle">search rows</text>
  </g>
  <path class="flow" d="M235 200h35"/><path class="flow" d="M450 200h35"/><path class="flow" d="M665 200h35"/><path class="flow" d="M880 200h35"/><path class="flow" d="M1095 200h35"/><path class="flow" d="M1310 200h35"/>

  <g aria-label="Step 8 embeddings">
    <rect class="store" x="920" y="335" width="255" height="115" rx="14"/>
    <text class="num" x="940" y="365">8</text><text class="label" x="1047" y="382" text-anchor="middle">Embed + upsert Vectorize</text>
    <text class="small" x="1047" y="412" text-anchor="middle">User namespace + scoped metadata</text><text class="small" x="1047" y="435" text-anchor="middle">system, document, version, chunk</text>
  </g>
  <g aria-label="Step 9 activation">
    <rect class="store" x="1270" y="335" width="255" height="115" rx="14"/>
    <text class="num" x="1290" y="365">9</text><text class="label" x="1397" y="382" text-anchor="middle">Atomic activation</text>
    <text class="small" x="1397" y="412" text-anchor="middle">Swap active_version_id only</text><text class="small" x="1397" y="435" text-anchor="middle">after every step succeeds</text>
  </g>
  <path class="flow" d="M1435 260v45H1047v30"/><path class="flow" d="M1175 393h95"/>

  <text class="label" x="65" y="335">Visible job states</text>
  <g aria-label="Visible states">
    <rect class="state" x="65" y="360" width="100" height="38" rx="9"/><text class="stateText" x="115" y="384" text-anchor="middle">queued</text>
    <rect class="state" x="175" y="360" width="115" height="38" rx="9"/><text class="stateText" x="232" y="384" text-anchor="middle">extracting</text>
    <rect class="state" x="300" y="360" width="105" height="38" rx="9"/><text class="stateText" x="352" y="384" text-anchor="middle">chunking</text>
    <rect class="state" x="415" y="360" width="110" height="38" rx="9"/><text class="stateText" x="470" y="384" text-anchor="middle">embedding</text>
    <rect class="state" x="535" y="360" width="85" height="38" rx="9"/><text class="stateText" x="577" y="384" text-anchor="middle">ready</text>
    <rect class="warn" x="630" y="360" width="95" height="38" rx="9"/><text class="stateText" x="677" y="384" text-anchor="middle">delayed</text>
    <rect class="danger" x="735" y="360" width="85" height="38" rx="9"/><text class="stateText" x="777" y="384" text-anchor="middle">failed</text>
    <text class="small" x="65" y="430">After five minutes, report delayed rather than failed; durable work continues.</text>
  </g>

  <rect class="lane" x="30" y="590" width="980" height="335" rx="18"/>
  <path class="laneHead" d="M48 590h944a18 18 0 0 1 18 18v42H30v-42a18 18 0 0 1 18-18Z"/>
  <text class="laneTitle" x="55" y="630">Failure and cleanup paths</text>
  <rect class="danger" x="65" y="690" width="260" height="90" rx="14"/>
  <text class="label" x="195" y="722" text-anchor="middle">Upload rejection</text>
  <text class="small" x="195" y="750" text-anchor="middle">MIME mismatch, size, extension</text>
  <rect class="danger" x="370" y="690" width="270" height="90" rx="14"/>
  <text class="label" x="505" y="722" text-anchor="middle">Extraction rejection</text>
  <text class="small" x="505" y="750" text-anchor="middle">Scanned, encrypted, corrupt, empty</text>
  <rect class="warn" x="685" y="690" width="285" height="90" rx="14"/>
  <text class="label" x="827" y="722" text-anchor="middle">Retryable runtime/provider error</text>
  <text class="small" x="827" y="750" text-anchor="middle">Workflow retries without duplicates</text>
  <rect class="store" x="285" y="825" width="450" height="65" rx="14"/>
  <text class="label" x="510" y="851" text-anchor="middle">Terminal cleanup</text>
  <text class="small" x="510" y="876" text-anchor="middle">Remove temporary artifacts and release quota reservation</text>
  <path class="fail" d="M195 780c0 45 90 45 90 77"/><path class="fail" d="M505 780v45"/>
  <path class="retry" d="M970 735H1025V555L1047 450"/>
  <rect class="lane" x="1040" y="590" width="530" height="335" rx="18"/>
  <path class="laneHead" d="M1058 590h494a18 18 0 0 1 18 18v42h-530v-42a18 18 0 0 1 18-18Z"/>
  <text class="laneTitle" x="1065" y="630">Replacement lane</text>
  <rect class="store" x="1080" y="690" width="190" height="90" rx="14"/>
  <text class="label" x="1175" y="722" text-anchor="middle">Old version</text><text class="small" x="1175" y="750" text-anchor="middle">remains active</text>
  <rect class="work" x="1340" y="690" width="190" height="90" rx="14"/>
  <text class="label" x="1435" y="722" text-anchor="middle">New version</text><text class="small" x="1435" y="750" text-anchor="middle">processes independently</text>
  <path class="retry" d="M1270 735h70"/>
  <rect class="store" x="1175" y="825" width="260" height="65" rx="14"/>
  <text class="label" x="1305" y="851" text-anchor="middle">One-transaction pointer swap</text><text class="small" x="1305" y="876" text-anchor="middle">then clean superseded derived data</text>
  <path class="flow" d="M1435 780V805H1305V825"/>
</svg>
